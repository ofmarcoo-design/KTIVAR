name: KTIVAR visual review
on:
  pull_request:
    paths:
      - 'public/**'
      - 'views/**'
      - 'scripts/verify-responsive.js'
      - '.github/workflows/ui-visual-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install browser test runner (CI only)
        run: npm install --no-save --package-lock=false playwright@1.65.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Responsive and accessible UI fixture
        run: node scripts/verify-responsive.js
        env:
          QA_SCREENSHOT_DIR: qa-screenshots
      - name: Save anonymized test-fixture screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ktivar-ui-review
          path: qa-screenshots/
          if-no-files-found: warn
          retention-days: 3
